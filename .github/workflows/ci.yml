name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # End-to-end tests (npm run e2e) do not run here: they package the app and need a display
  # server. They are run locally instead (see docs/PLAN.md §10). Installers are built by the
  # Release workflow, which is triggered manually.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
