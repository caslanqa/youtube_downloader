name: Release

# Manual trigger only: pick how the version should be bumped and the workflow tags the
# repository, builds installers on all three platforms and publishes a GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The checks run before the tag exists, so a broken commit never gets a version.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Bump version and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # npm version writes package.json/package-lock.json, commits and creates the vX.Y.Z tag.
          TAG="$(npm version "${{ inputs.bump }}" -m 'release: %s')"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Needed to create the release and upload assets; the default token can only read.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install rpm tooling (for MakerRpm)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: npm ci
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: out/make/**/*
          if-no-files-found: error

      # Installers are unsigned: macOS shows a Gatekeeper prompt and Windows a SmartScreen
      # warning (docs/PLAN.md §12, §14).
      - name: Publish installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          # All three runners arrive at once: the first creates the release and the others fail
          # with "already exists", which is expected and therefore swallowed.
          gh release create "$TAG" --title "$TAG" --generate-notes || true
          # -print0/xargs -0: the macOS and Windows installers have spaces in their file names
          # ("YouTube Downloader-2.0.0-arm64.dmg"), which command substitution would split.
          find out/make -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.deb' -o -name '*.rpm' \) -print0 \
            | xargs -0 gh release upload "$TAG" --clobber
